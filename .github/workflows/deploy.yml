name: Deploy Da-Costa Svalinn

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build Next.js app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Firebase
        run: firebase deploy --only hosting --project da-costa-unisoc23v1-6386-61f95
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Pin environment variables on Cloud Run
        run: |
          gcloud run services update ssrdacostaunisoc23v1638 \
            --region=europe-west1 \
            --project=da-costa-unisoc23v1-6386-61f95 \
            --update-env-vars OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }},AZURE_TRANSLATOR_KEY=${{ secrets.AZURE_TRANSLATOR_KEY }},AZURE_TRANSLATOR_REGION=${{ secrets.AZURE_TRANSLATOR_REGION }}
          sleep 30
          gcloud run services update-traffic ssrdacostaunisoc23v1638 \
            --region=europe-west1 \
            --project=da-costa-unisoc23v1-6386-61f95 \
            --to-latest
