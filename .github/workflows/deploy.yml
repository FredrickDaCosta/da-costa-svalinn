name: Deploy Da-Costa Svalinn

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Check NEXT_PUBLIC_ADMIN_UID is set (diagnostic — never prints the value)
        run: |
          if [ -z "$NEXT_PUBLIC_ADMIN_UID" ]; then
            echo "NEXT_PUBLIC_ADMIN_UID: EMPTY OR UNSET"
          else
            echo "NEXT_PUBLIC_ADMIN_UID: SET (length: ${#NEXT_PUBLIC_ADMIN_UID})"
          fi
        env:
          NEXT_PUBLIC_ADMIN_UID: ${{ secrets.NEXT_PUBLIC_ADMIN_UID }}

      - name: Check SCHEDULER_SECRET is set (diagnostic — never prints the value)
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "SCHEDULER_SECRET: EMPTY OR UNSET — Cloud Scheduler jobs will 401 against run-scan until this is set."
          else
            echo "SCHEDULER_SECRET: SET (length: ${#SCHEDULER_SECRET})"
          fi
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}

      - name: Guard against client Firebase SDK in server-only code
        run: npm run check:server-sdk

      - name: Build Next.js app
        run: npm run build
        env:
          # NEXT_PUBLIC_* vars are inlined into the client bundle at build
          # time, so this must be a real env var here — writing it into the
          # Firebase Hosting .env file later in this workflow wouldn't work,
          # since that file is only read at Cloud Run SSR runtime, after the
          # client bundle has already been built.
          NEXT_PUBLIC_ADMIN_UID: ${{ secrets.NEXT_PUBLIC_ADMIN_UID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create Firebase project env file
        run: |
          cat <<EOF > .env.da-costa-unisoc23v1-6386-61f95
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          AZURE_TRANSLATOR_KEY=${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION=southafricanorth
          VIRUSTOTAL_API_KEY=${{ secrets.VIRUSTOTAL_API_KEY }}
          NEXT_PUBLIC_ADMIN_UID=${{ secrets.NEXT_PUBLIC_ADMIN_UID }}
          SCHEDULER_SECRET=${{ secrets.SCHEDULER_SECRET }}
          EOF
          cat .env.da-costa-unisoc23v1-6386-61f95

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project da-costa-unisoc23v1-6386-61f95
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project da-costa-unisoc23v1-6386-61f95
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          # TEMPORARY: relies on Next.js's internal/undocumented webpack
          # selection flag, not public API, no semver guarantee. This
          # unblocks production now; see
          # docs/tech-debt-turbopack-firebase-build.md for the permanent fix
          # (direct Cloud Run deploy via Dockerfile, bypassing Firebase's
          # Next.js framework auto-detection). Do not consider this resolved
          # long-term.
          #
          # Firebase's Next.js framework auto-build (this step) always runs
          # its own internal `next build` regardless of package.json's build
          # script, and always defaults to Turbopack, which has a confirmed
          # bug externalizing firebase-admin's dual CJS/ESM subpath exports
          # (ERR_MODULE_NOT_FOUND on every withAuth/withAdminAuth call).
          # IS_WEBPACK_TEST is the only environment variable Next's own CLI
          # bundler-arg parser (next/dist/lib/bundler.js) checks to force the
          # webpack bundler through this code path, since firebase-tools
          # spawns `next build` with no way to pass --webpack directly.
          IS_WEBPACK_TEST: "1"

      - name: Set Cloud Run timeout
        run: |
          gcloud run services update ssrdacostaunisoc23v1638 \
            --region=europe-west1 \
            --project=da-costa-unisoc23v1-6386-61f95 \
            --timeout=120

      - name: Install Firebase Functions dependencies
        run: |
          cd functions
          npm install

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project da-costa-unisoc23v1-6386-61f95
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Configure Cloud Scheduler
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "SCHEDULER_SECRET is not set — skipping Cloud Scheduler job setup. Background scans will not run until this secret is added and this workflow re-runs."
            exit 0
          fi
          chmod +x infrastructure/cloudscheduler-setup.sh
          ./infrastructure/cloudscheduler-setup.sh
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}

      - name: Verify deployment environment
        run: |
          echo "Deployment complete. Environment vars baked in via .env project file."
          echo "Serving revision receives OPENROUTER_API_KEY from Firebase deploy."