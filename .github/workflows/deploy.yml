name: Deploy Da-Costa Svalinn — Infra (Functions, Firestore, Hosting config, Scheduler)

# Handles everything that isn't the SSR app itself, which
# deploy-app.yml owns since the Turbopack/webpack permanent fix
# migration (see docs/tech-debt-turbopack-firebase-build.md, CLOSED):
# WebAuthn/passkey Cloud Functions, Firestore rules/indexes, the
# Firebase Hosting rewrite config (svalinn-ssr), and Cloud Scheduler.
# The Hosting/Firestore/Scheduler steps here are intentionally
# redundant with deploy-app.yml's own copies -- both are idempotent,
# and this workflow existing independently of the app's own build
# means Functions can still deploy even if the app build ever fails.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Check SCHEDULER_SECRET is set (diagnostic — never prints the value)
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "SCHEDULER_SECRET: EMPTY OR UNSET — Cloud Scheduler jobs will 401 against run-scan until this is set."
          else
            echo "SCHEDULER_SECRET: SET (length: ${#SCHEDULER_SECRET})"
          fi
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}

      - name: Guard against client Firebase SDK in server-only code
        run: npm run check:server-sdk

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Firestore rules and indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project da-costa-unisoc23v1-6386-61f95
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Hosting rewrite config (svalinn-ssr)
        # Plain "run" rewrite only -- no frameworksBackend, so this is a
        # fast, framework-detection-free config push (~10-20s), not a
        # Next.js build. See docs/tech-debt-turbopack-firebase-build.md.
        run: firebase deploy --only hosting --project da-costa-unisoc23v1-6386-61f95
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Install Firebase Functions dependencies
        run: |
          cd functions
          npm install

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project da-costa-unisoc23v1-6386-61f95
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Configure Cloud Scheduler
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "SCHEDULER_SECRET is not set — skipping Cloud Scheduler job setup. Background scans will not run until this secret is added and this workflow re-runs."
            exit 0
          fi
          chmod +x infrastructure/cloudscheduler-setup.sh
          ./infrastructure/cloudscheduler-setup.sh
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}

      - name: Verify deployment environment
        run: echo "Functions, Firestore, Hosting config, and Cloud Scheduler deployed. App runtime env vars are set on svalinn-ssr directly by deploy-app.yml."