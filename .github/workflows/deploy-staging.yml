name: Deploy Staging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build_and_deploy_staging:
    needs: lint-test
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_ADMIN_UID: ${{ secrets.STAGING_NEXT_PUBLIC_ADMIN_UID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.STAGING_NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STAGING_GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create Firebase staging env file
        run: |
          cat <<EOF > .env.da-costa-svalinn-staging
          OPENROUTER_API_KEY=${{ secrets.STAGING_OPENROUTER_API_KEY }}
          AZURE_TRANSLATOR_KEY=${{ secrets.STAGING_AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION=southafricanorth
          VIRUSTOTAL_API_KEY=${{ secrets.STAGING_VIRUSTOTAL_API_KEY }}
          NEXT_PUBLIC_ADMIN_UID=${{ secrets.STAGING_NEXT_PUBLIC_ADMIN_UID }}
          EOF

      - name: Deploy Firestore rules to staging
        run: firebase deploy --only firestore:rules --project da-costa-svalinn-staging
        env:
          FIREBASE_TOKEN: ${{ secrets.STAGING_FIREBASE_TOKEN }}

      - name: Deploy to Firebase Hosting Preview Channel (PRs)
        if: github.event_name == 'pull_request'
        run: |
          firebase hosting:channel:deploy pr-${{ github.event.number }} \
            --project da-costa-svalinn-staging \
            --expires 7d
        env:
          FIREBASE_TOKEN: ${{ secrets.STAGING_FIREBASE_TOKEN }}

      - name: Deploy to Firebase Hosting Staging (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: firebase deploy --only hosting --project da-costa-svalinn-staging
        env:
          FIREBASE_TOKEN: ${{ secrets.STAGING_FIREBASE_TOKEN }}
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Deploy Firebase Functions to staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd functions
          npm install
          firebase deploy --only functions --project da-costa-svalinn-staging
        env:
          FIREBASE_TOKEN: ${{ secrets.STAGING_FIREBASE_TOKEN }}

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: channels } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'preview'
            });
            // This would need actual Firebase Hosting API integration
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'Staging preview deployed! Check Firebase Console for the preview channel URL.'
            });