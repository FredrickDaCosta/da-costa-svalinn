name: Deploy Da-Costa Svalinn (direct Cloud Run)

# Phase 3 of the Turbopack/webpack permanent fix -- see
# docs/tech-debt-turbopack-firebase-build.md. Runs on every push to main,
# same trigger as the existing deploy.yml, as a SEPARATE, additional
# pipeline -- deploy.yml is untouched and keeps deploying the current
# production path in parallel. This workflow only ever touches the
# self-managed svalinn-ssr Cloud Run service; the frameworksBackend-managed
# service (ssrdacostaunisoc23v1638) and Firebase Hosting's routing are not
# touched here. svalinn-ssr carries no live traffic until Phase 5's
# explicit cutover of firebase.json's hosting rewrite.
#
# Secrets are wired via `gcloud run deploy --set-env-vars` from GitHub
# Actions' own secret store, since those values are write-only (not even
# `gh secret list` can read them back) -- a CI run is the only place they
# can be threaded into a deploy command.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: da-costa-unisoc23v1-6386-61f95
  REGION: europe-west1
  SERVICE_NAME: svalinn-ssr
  IMAGE: europe-west1-docker.pkg.dev/da-costa-unisoc23v1-6386-61f95/svalinn-app/svalinn:ssr

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Guard against client Firebase SDK in server-only code
        run: npm run check:server-sdk

      - name: Typecheck
        run: npm run typecheck

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Firestore rules and indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project da-costa-unisoc23v1-6386-61f95
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Build image via Cloud Build (next build --webpack, not Turbopack)
        env:
          BA_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          BA_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          BA_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          BA_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          BA_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          BA_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          BA_ADMIN_UID: ${{ secrets.NEXT_PUBLIC_ADMIN_UID }}
        run: |
          # `gcloud builds submit --tag` (used in Phase 1's manual smoke test)
          # does not support --build-arg at all -- confirmed via a real
          # "unrecognized arguments" error. A full cloudbuild.yaml config is
          # required to pass build args through to the docker build step.
          cat > /tmp/cloudbuild.yaml <<EOF
          steps:
            - name: 'gcr.io/cloud-builders/docker'
              args:
                - build
                - -t
                - '${IMAGE}'
                - --build-arg
                - NEXT_PUBLIC_FIREBASE_API_KEY=${BA_API_KEY}
                - --build-arg
                - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${BA_AUTH_DOMAIN}
                - --build-arg
                - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${BA_PROJECT_ID}
                - --build-arg
                - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${BA_STORAGE_BUCKET}
                - --build-arg
                - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${BA_SENDER_ID}
                - --build-arg
                - NEXT_PUBLIC_FIREBASE_APP_ID=${BA_APP_ID}
                - --build-arg
                - NEXT_PUBLIC_ADMIN_UID=${BA_ADMIN_UID}
                - '.'
          images:
            - '${IMAGE}'
          EOF
          gcloud builds submit --project="$PROJECT_ID" --region="$REGION" --config=/tmp/cloudbuild.yaml .

      - name: Deploy to Cloud Run (svalinn-ssr -- not live traffic yet)
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --allow-unauthenticated \
            --timeout=180 \
            --cpu=1 \
            --memory=512Mi \
            --port=8080 \
            --set-env-vars="OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }},AZURE_TRANSLATOR_KEY=${{ secrets.AZURE_TRANSLATOR_KEY }},AZURE_TRANSLATOR_REGION=southafricanorth,VIRUSTOTAL_API_KEY=${{ secrets.VIRUSTOTAL_API_KEY }},NEXT_PUBLIC_ADMIN_UID=${{ secrets.NEXT_PUBLIC_ADMIN_UID }},SCHEDULER_SECRET=${{ secrets.SCHEDULER_SECRET }},URLHAUS_API_KEY=${{ secrets.URLHAUS_API_KEY }},OTX_API_KEY=${{ secrets.OTX_API_KEY }},ABUSEIPDB_API_KEY=${{ secrets.ABUSEIPDB_API_KEY }}"

      - name: Configure Cloud Scheduler
        # Matches deploy.yml's own step exactly. Currently a harmless,
        # idempotent no-op duplicate: the jobs target Firebase Hosting's
        # stable .web.app domain, which still routes to the OLD service
        # until Phase 5's cutover, so re-applying the same job definitions
        # here changes nothing about where traffic goes yet. Included now
        # for full parity, so this pipeline is fully self-sufficient ahead
        # of Phase 5/6.
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "SCHEDULER_SECRET is not set — skipping Cloud Scheduler job setup."
            exit 0
          fi
          chmod +x infrastructure/cloudscheduler-setup.sh
          ./infrastructure/cloudscheduler-setup.sh
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}

      - name: Print service URL
        run: |
          echo "SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')" >> "$GITHUB_ENV"

      - name: Verify - root page
        run: |
          curl -sS -o /dev/null -w "root page: HTTP %{http_code}\n" "$SERVICE_URL/"

      - name: Verify - admin route rejects unauthenticated requests cleanly
        run: |
          curl -sS -o /tmp/auth_check.json -w "auth check: HTTP %{http_code}\n" \
            -X POST "$SERVICE_URL/api/threat-intel/ingest" -H "Content-Type: application/json" -d '{}'
          cat /tmp/auth_check.json
          echo

      - name: Verify - real scheduler-authenticated Firestore write (OpenPhish, no external key needed)
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          # Real functional test, not just an auth-layer check: this exercises
          # getAdminFirestore()'s applicationDefault() resolution AND real
          # Firestore writes, on a plain Cloud Run deploy with none of the
          # Functions-framework-injected vars (FIREBASE_CONFIG, GCLOUD_PROJECT,
          # etc.) the old frameworksBackend-managed service gets automatically.
          curl -sS -w "\nHTTP %{http_code}\n" \
            -X POST "$SERVICE_URL/api/threat-intel/ingest" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SCHEDULER_SECRET}" \
            -d '{"source":"openphish"}'
